name: Alerta ONPE

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:         # botón para ejecutarlo a mano

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar convocatorias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PALABRAS: "COORDINADOR"
          DEPARTAMENTO: "LORETO"
        run: python alerta.py

      - name: Guardar lo ya avisado
        run: |
          git config user.name "alerta-bot"
          git config user.email "alerta-bot@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || git commit -m "Actualiza vistos"
          git push
