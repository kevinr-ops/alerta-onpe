name: Alerta ONPE

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:         # botón para ejecutarlo a mano

permissions:
  contents: write

# Evita que dos ejecuciones se crucen al guardar vistos.json
concurrency:
  group: alerta-onpe
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar convocatorias
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PALABRAS: "COORDINADOR"        # varias: "COORDINADOR,ASISTENTE"
          DEPARTAMENTO: "LORETO"         # vacío = todo el Perú
          ENTIDAD: ""                    # ej: "PROCESOS ELECTORALES" = solo ONPE; vacío = cualquier entidad
        run: python alerta.py

      - name: Guardar lo ya avisado
        run: |
          git config user.name "alerta-bot"
          git config user.email "alerta-bot@users.noreply.github.com"
          git add vistos.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualiza vistos"
            git pull --rebase
            git push
          fi

